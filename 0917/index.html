<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stlye.css">
    
    <title>Document</title>
</head>
<body>

    <table>
        <tbody>
            <tr>
                <td>Piros:</td>
                <td><input type="range" id="red-range" min="0" max="255" value="0" ></td>
                <td><input type="number" id="red-value" min="0" max="255" value="0"></td>
            </tr>
            <tr>
                <td>Zold:</td>
                <td><input type="range" id="green-range" min="0" max="255" value="0"></td>
                <td><input type="number" id="green-value" min="0" max="255" value="0"></td>
            </tr>
            <tr>
                <td>Kek:</td>
                <td><input type="range" id="blue-range" min="0" max="255" value="0"></td>
                <td><input type="number" id="blue-value" min="0" max="255" value="0"></td>
            </tr>
            <tr>
                <td>Alfa:</td>
                <td><input type="range" id="alpha-range" min="0" max="1" value="1" step="0.01"></td>
                <td><input type="number" id="alpha-value" min="0" max="255" value="1" step="0.01"></td>
            </tr>
            <tr>
                <td>Szélesség:</td>
                <td><input type="range" id="width-range" min="0" max="600" value="300"></td>
                <td><input type="number" id="width-value" min="0" max="600" value="300"></td>
            </tr>
            <tr>
                <td>Magasság:</td>
                <td><input type="range" id="height-range" min="0" max="400" value="300" ></td>
                <td><input type="number" id="height-value" min="0" max="400" value="300" ></td>
            </tr>
            <tr>
                <td>Bal Margo:</td>
                <td><input type="range" id="leftmargin-range" min="-600" max="600" value="0" ></td>
                <td><input type="number" id="leftmargin-value" min="-600" max="600" value="0" ></td>
            </tr>
            <tr>
                <td>Felso Margo:</td>
                <td><input type="range" id="topmargin-range" min="-1000" max="1000" value="0" ></td>
                <td><input type="number" id="topmargin-value" min="-1000" max="1000" value="0" ></td>
            </tr>
            <tr>
                <td>Hatarsugar:</td>
                <td><input type="range" id="border-range" min="0" max="300" value="0" ></td>
                <td><input type="number" id="border-value" min="0" max="300" value="0" ></td>
            </tr>
            <tr>
                <td>Forgatas:</td>
                <td><input type="range" id="spin-range" min="0" max="360" value="0" ></td>
                <td><input type="number" id="spin-value" min="0" max="360" value="0" ></td>
            </tr>
        </tbody>
    </table>
    
    <div id="rgb-box"></div>

    <script src="function.js"></script>
</body>
</html>
